<g data-stage="source-audit"><rect x="48" y="420" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="63" y="450">核对源码与机构锁</text>
<text class="s" x="63" y="475">验证快照及依赖来源</text>
<text class="p" x="63" y="502">source-audit</text>
</g>
<g data-stage="upstream"><rect x="350" y="160" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="365" y="190">获取锁定上游</text>
<text class="s" x="365" y="215">准备官方 Host 与外壳源码</text>
<text class="p" x="365" y="242">upstream</text>
</g>
<g data-stage="runtime"><rect x="350" y="290" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="365" y="320">安装 npm Runtime</text>
<text class="s" x="365" y="345">使用锁定的官方发布包</text>
<text class="p" x="365" y="372">runtime</text>
</g>
<g data-stage="source-dependencies"><rect x="350" y="550" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="365" y="580">安装 npm 插件</text>
<text class="s" x="365" y="605">准备插件包与构建依赖</text>
<text class="p" x="365" y="632">source-dependencies</text>
</g>
<g data-stage="host-adapter"><rect x="652" y="160" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="667" y="190">构建桌面 Host</text>
<text class="s" x="667" y="215">生成桌面通信适配器</text>
<text class="p" x="667" y="242">host-adapter</text>
</g>
<g data-stage="source-clients"><rect x="652" y="420" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="667" y="450">编译产品扩展</text>
<text class="s" x="667" y="475">基于已发布包构建客户端</text>
<text class="p" x="667" y="502">source-clients</text>
</g>
<g data-stage="product"><rect x="954" y="420" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="969" y="450">生成桌面产品</text>
<text class="s" x="969" y="475">汇集 Web 与 Host</text>
<text class="p" x="969" y="502">product</text>
</g>
<g data-stage="electron-tools"><rect x="350" y="680" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="365" y="710">准备外壳工具链</text>
<text class="s" x="365" y="735">安装锁定的构建依赖</text>
<text class="p" x="365" y="762">electron-tools</text>
</g>
<g data-stage="electron"><rect x="652" y="680" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="667" y="710">准备 Electron</text>
<text class="s" x="667" y="735">获取锁定的运行时</text>
<text class="p" x="667" y="762">electron</text>
</g>
<g data-stage="shell"><rect x="954" y="160" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="969" y="190">构建桌面外壳</text>
<text class="s" x="969" y="215">编译 Electron 界面</text>
<text class="p" x="969" y="242">shell</text>
</g>
<g data-stage="native-inputs"><rect x="652" y="810" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="667" y="840">准备原生资源</text>
<text class="s" x="667" y="865">获取对应系统的资源</text>
<text class="p" x="667" y="892">native-inputs</text>
</g>
<g data-stage="native-install"><rect x="1256" y="550" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="1271" y="580">安装原生资源</text>
<text class="s" x="1271" y="605">将资源写入产品</text>
<text class="p" x="1271" y="632">native-install</text>
</g>
<g data-stage="sparkle"><rect x="1256" y="680" width="210" height="104" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text class="t" x="1271" y="710">准备 Mac 更新</text>
<text class="s" x="1271" y="735">配置 Sparkle 更新组件</text>
<text class="p" x="1271" y="762">sparkle</text>
<text class="s" x="1452" y="762" text-anchor="end">仅 macOS</text>
</g>
<g data-stage="desktop"><rect x="1860" y="420" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="1875" y="450">打包桌面应用</text>
<text class="s" x="1875" y="475">生成目标系统的安装包</text>
<text class="p" x="1875" y="502">desktop</text>
</g>
<g data-stage="accept"><rect x="2162" y="420" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="2177" y="450">验收桌面包</text>
<text class="s" x="2177" y="475">检查打包后的启动</text>
<text class="p" x="2177" y="502">accept</text>
</g>
<g data-stage="publish"><rect x="2464" y="420" width="210" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text class="t" x="2479" y="450">生成交付文件</text>
<text class="s" x="2479" y="475">整理归档与构建回执</text>
<text class="p" x="2479" y="502">publish</text>
</g>
</svg>
