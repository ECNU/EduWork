<defs>
  <linearGradient id="macJoin" gradientUnits="userSpaceOnUse" x1="1466" y1="0" x2="1788" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#1f883d"/></linearGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f883d"/></marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker>
