# Keep legacy storage domains and database paths for in-place upgrades.
# DSH 0.2.1 keys config forms by entry id; match the former settings namespace
# so its automatic settings.yaml migration preserves existing preferences.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-query-memory.sqlite3')
    openAt: first-search
- id: storage-domain
  config:
    backend: json
    routes:
      local_memory: sqlite
- insert:
    - id: local-memory-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        path: !!js dshHomePath('memory.sqlite3')
    - id: memories
      name: '@eduwork/dsh-memory'
      config:
        enabled: true
        search_prior_chats: true
