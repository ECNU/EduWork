openapi: 3.1.0
info:
  title: EduWork Identity and Resource Protocol
  version: 1.0.0
  description: >-
    Optional resource integration for a local single-user OIDC client.
    Management uses worker-user-center-v1 bootstrap and credential operations. Quota and activity heartbeat are institution extensions, absent from this contract.
    Model discovery uses the resulting runtime API key, never the
    identity token. Pure OIDC deployments may omit resource integration.
  license: { name: MIT, identifier: MIT }
servers:
  - url: https://ai.example.edu/open/api/v1
security:
  - runtimeKey: []
paths:
  /models:
    get:
      operationId: listResourceModels
      responses:
        '200':
          description: Available model identifiers; reviewed capabilities remain in the client Profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    minItems: 1
                    maxItems: 128
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { type: string, minLength: 1, maxLength: 256 }
        '401': { description: Runtime key is invalid or expired }
        '403': { description: Model discovery is not permitted; keep the reviewed catalog }
        '404': { description: Discovery not supported; client keeps reviewed model catalog }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/Unavailable' }
components:
  responses:
    RateLimited:
      description: Temporarily limited; current client reports unavailable and allows a later manual refresh
      headers:
        Retry-After: { schema: { type: string }, description: Seconds or HTTP date for a future retry; never a refresh-token grant }
    Unavailable:
      description: Temporary resource failure; do not clear identity or the model key
  securitySchemes:
    runtimeKey: { type: http, scheme: bearer, description: Model runtime credential }
