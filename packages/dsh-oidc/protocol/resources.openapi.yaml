openapi: 3.1.0
info:
  title: EduWork Identity and Resource Protocol
  version: 1.0.0
  description: >-
    Model discovery for a local single-user client with explicit gateway authorization.
    Requests use the current Access Token. The client does not provision model API keys.
    Quota and activity heartbeat remain optional institution extensions.
  license: { name: MIT, identifier: MIT }
servers:
  - url: https://ai.example.edu/open/api/v1
security:
  - accessToken: []
paths:
  /models:
    get:
      operationId: listResourceModels
      responses:
        '200':
          description: Authorized model identifiers and optional purpose metadata; reviewed capabilities remain in the client Profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    minItems: 0
                    maxItems: 128
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { type: string, minLength: 1, maxLength: 256 }
                        type:
                          type: string
                          description: >-
                            Optional EduWork purpose extension, independent of input modalities and
                            the OpenAI object field. Known values are llm, embedding, rerank, image,
                            tts and unknown. Server declarations take precedence over client Profile
                            metadata; absent types use Profile metadata. Unsupported or unresolved
                            types normalize to unknown. Only llm registers for conversation.
        '401': { description: Access Token is invalid or expired }
        '403': { description: Model discovery is not permitted }
        '404': { description: Discovery endpoint is unavailable }
        '429': { $ref: '#/components/responses/RateLimited' }
        '5XX': { $ref: '#/components/responses/Unavailable' }
components:
  responses:
    RateLimited:
      description: Temporarily limited; current client reports unavailable and allows a later manual refresh
      headers:
        Retry-After: { schema: { type: string }, description: Seconds or HTTP date for a future retry; never a refresh-token grant }
    Unavailable:
      description: Temporary resource failure; do not clear identity or a still-valid Access Token
  securitySchemes:
    accessToken: { type: http, scheme: bearer, description: Model runtime credential }
