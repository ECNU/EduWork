name: Qualify pinned DSH candidate
on:
  pull_request:
    paths:
      - '.github/workflows/validate-core-017.yml'
      - 'third_party/dsh/**'
      - 'config/desktop-build.json'
      - 'scripts/desktop-build-plan.mjs'
      - 'dsh-host/prepare-native.mjs'
      - 'dsh-host/distribution-policy.mjs'
      - 'third_party/dsh-literature/**'
      - 'dsh-host/test/native-020.test.mjs'
      - 'dsh-host/upstream-inputs-017.json'
      - 'dsh-host/native-profile.mjs'
      - 'dsh-host/settings-migration.mjs'
      - 'dsh-host/redacted-log.mjs'
      - 'dsh-host/native-resources.mjs'
      - 'dsh-host/test/native-resources*.mjs'
      - 'dsh-host/test/native-settings.test.mjs'
      - 'dsh-host/test/redacted-log.test.mjs'
      - 'scripts/probe-eduwork-017-host.mjs'
      - 'scripts/probe-eduwork-017-settings.mjs'
      - 'scripts/build-017-plugin-clients.mjs'
      - 'scripts/native-preset-ui.mjs'
      - 'scripts/native-file-reference-ui.mjs'
      - 'scripts/assemble-017-source-product.mjs'
      - 'scripts/prepare-017-alpha-product.mjs'
      - 'scripts/distribution-config-patches.mjs'
      - 'scripts/test/distribution-config-patches.test.mjs'
      - 'scripts/patch-session-search-runtime.mjs'
      - 'scripts/test/session-search-runtime.test.mjs'
      - 'scripts/test/plugin-locale.test.mjs'
      - 'scripts/verify-media-template.mjs'
      - 'scripts/test/media-template.test.mjs'
      - 'scripts/portable-product-links.mjs'
      - 'scripts/test/portable-product-links.test.mjs'
      - 'scripts/probe-017-source-product.mjs'
      - 'scripts/probe-017-deliverables.mjs'
      - 'scripts/probe-017-literature.mjs'
      - 'dsh-host/product-profile.mjs'
      - 'dsh-electron/src/**'
      - 'dsh-electron/scripts/**'
      - 'dsh-electron/tests/**'
      - 'dsh-electron/upstream-inputs-017.json'
      - 'dsh-plugins/**'
      - 'packages/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Resolve the pinned build recipe
        id: upstream
        shell: pwsh
        run: |
          $plan = node core/scripts/desktop-build-plan.mjs --core core --version 0.0.0-alpha.1
          if ($LASTEXITCODE) { throw 'Invalid desktop build recipe' }
          $plan = $plan | ConvertFrom-Json
          "commit=$($plan.upstreamCommit)" >> $env:GITHUB_OUTPUT
          "DSH_SOURCE_LOCK=$($plan.sourceLock)" >> $env:GITHUB_ENV
          "DSH_CANDIDATE=$($plan.candidate)" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.upstream.outputs.commit }}
          path: upstream
          persist-credentials: false
      - name: Verify migration recovery and prepare the pinned Runtime
        shell: pwsh
        run: |
          node --test core/dsh-host/test/native-settings.test.mjs core/dsh-host/test/redacted-log.test.mjs core/dsh-host/test/native-resources.test.mjs
          if ($LASTEXITCODE) { throw 'Native settings migration checks failed' }
          $env:EDUWORK_TEST_UPSTREAM = (Resolve-Path upstream).Path
          node --test core/dsh-plugins/client-ui-branding/test/identity.test.mjs
          if ($LASTEXITCODE) { throw 'Product document identity checks failed' }
          node --test core/scripts/test/portable-product-links.test.mjs
          if ($LASTEXITCODE) { throw 'Portable source product links failed' }
          node --test core/dsh-electron/tests/desktop-exit.test.mjs core/dsh-electron/tests/window-visibility.test.mjs core/dsh-electron/tests/content-coordinator.test.mjs core/dsh-electron/tests/lifecycle.test.mjs
          if ($LASTEXITCODE) { throw 'Desktop quit and update handoff checks failed' }
          node core/dsh-desktop/scripts/prepare-dsh-runtime.mjs --source npm --lock "$env:DSH_SOURCE_LOCK" --output "$env:RUNNER_TEMP/native-runtime"
          if ($LASTEXITCODE) { throw 'Pinned npm Runtime preparation failed' }
          node core/scripts/probe-017-deliverables.mjs --runtime "$env:RUNNER_TEMP/native-runtime" --output "$env:RUNNER_TEMP/deliverables-evidence"
          if ($LASTEXITCODE) { throw 'Native deliverable qualification failed' }
          $env:EDUWORK_TEST_RUNTIME = "$env:RUNNER_TEMP/native-runtime"
          node --test core/scripts/test/distribution-config-patches.test.mjs
          if ($LASTEXITCODE) { throw 'Distribution config patch checks failed' }
          node --test core/dsh-plugins/tool-browser/test/*.test.mjs
          if ($LASTEXITCODE) { throw 'Managed browser lifecycle and search configuration checks failed' }
          node --test core/scripts/test/session-search-runtime.test.mjs
          if ($LASTEXITCODE) { throw 'Session search live persistence regression checks failed' }
          node --test core/dsh-host/test/native-020.test.mjs core/dsh-electron/tests/update-channel-migration.test.mjs core/dsh-electron/tests/alpha-update-migration.test.mjs
          if ($LASTEXITCODE) { throw 'Distribution policy, desktop and channel migration checks failed' }
          node --test core/scripts/test/media-template.test.mjs
          if ($LASTEXITCODE) { throw 'Shared media template build and assembly checks failed' }
          node --test core/dsh-plugins/workbench-native/test/data-import.test.mjs core/dsh-plugins/workbench-native/test/import-catalog.test.mjs
          if ($LASTEXITCODE) { throw 'Historical directory import qualification failed' }
      - name: Qualify authenticated Host transport and update admission
        shell: pwsh
        run: |
          node core/dsh-host/prepare-native.mjs --upstream upstream --output "$env:RUNNER_TEMP/native-host"
          if ($LASTEXITCODE) { throw 'Pinned Host adaptation failed' }
          node core/scripts/probe-eduwork-017-host.mjs --runtime "$env:RUNNER_TEMP/native-runtime" --host "$env:RUNNER_TEMP/native-host" --output "$env:RUNNER_TEMP/native-host-evidence"
          if ($LASTEXITCODE) { throw 'Native Host qualification failed' }
      - name: Build source plugins and qualify native settings and RPC
        shell: pwsh
        run: |
          $deps = "$env:RUNNER_TEMP/source-deps"
          New-Item -ItemType Directory -Path $deps | Out-Null
          Copy-Item "$env:DSH_CANDIDATE/source-probe/package*.json" $deps
          npm ci --prefix $deps --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Locked qualification dependencies failed' }
          $env:EDUWORK_TEST_RUNTIME = "$env:RUNNER_TEMP/native-runtime"
          $env:EDUWORK_TEST_DEPENDENCIES = $deps
          node --test core/scripts/test/plugin-locale.test.mjs
          if ($LASTEXITCODE) { throw 'Plugin locale regression checks failed' }
          node core/scripts/build-017-plugin-clients.mjs --runtime "$env:RUNNER_TEMP/native-runtime" --dependencies $deps --output "$env:RUNNER_TEMP/source-stage" --report "$env:RUNNER_TEMP/client-build.json"
          if ($LASTEXITCODE) { throw 'Candidate client build failed' }
          node "$env:RUNNER_TEMP/source-stage/packages/dsh-memory/scripts/check-session-contract.mjs" "$env:RUNNER_TEMP/native-runtime"
          if ($LASTEXITCODE) { throw 'Memory message admission and user intent checks failed' }
          node core/scripts/probe-eduwork-017-settings.mjs --runtime "$env:RUNNER_TEMP/native-runtime" --dependencies $deps --source "$env:RUNNER_TEMP/source-stage" --full-product --output "$env:RUNNER_TEMP/settings-evidence"
          if ($LASTEXITCODE) { throw 'Product settings and RPC qualification failed' }
      - name: Build the pinned native shell and exercise real Electron bridges
        shell: pwsh
        run: |
          $desktopTools = "$env:RUNNER_TEMP/desktop-tools/apps/desktop"
          New-Item -ItemType Directory -Path $desktopTools -Force | Out-Null
          Copy-Item "$env:DSH_CANDIDATE/desktop-probe/package*.json" $desktopTools
          npm ci --prefix $desktopTools --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Pinned Electron metadata installation failed' }
          ./core/dsh-electron/scripts/prepare-electron.ps1 -Upstream "$env:RUNNER_TEMP/desktop-tools" -Output "$env:RUNNER_TEMP/electron"
          node core/dsh-electron/scripts/build-shell.mjs --native-017 --upstream upstream --runtime "$env:RUNNER_TEMP/native-runtime" --host "$env:RUNNER_TEMP/native-host" --output "$env:RUNNER_TEMP/native-shell"
          if ($LASTEXITCODE) { throw 'Native desktop build failed' }
          $env:EDUWORK_TEST_NATIVE_SHELL = "$env:RUNNER_TEMP/native-shell"
          node --experimental-test-module-mocks --experimental-transform-types --test core/dsh-electron/tests/installer-cleanup.test.mjs
          if ($LASTEXITCODE) { throw 'Native installer startup checks failed' }
          $electron = if ($IsWindows) { "$env:RUNNER_TEMP/electron/runtime/electron.exe" } else { "$env:RUNNER_TEMP/electron/runtime/Electron.app/Contents/MacOS/Electron" }
          node core/dsh-electron/scripts/probe-native-desktop.mjs --shell "$env:RUNNER_TEMP/native-shell" --runtime "$env:RUNNER_TEMP/native-runtime" --electron $electron --output "$env:RUNNER_TEMP/native-desktop-evidence"
          if ($LASTEXITCODE) { throw 'Native Electron acceptance failed' }
      - name: Qualify the assembled desktop product without source resolution hooks
        shell: pwsh
        run: |
          node core/scripts/assemble-017-source-product.mjs --runtime "$env:RUNNER_TEMP/native-runtime" --source "$env:RUNNER_TEMP/source-stage" --dependencies "$env:RUNNER_TEMP/source-deps" --host "$env:RUNNER_TEMP/native-host" --output "$env:RUNNER_TEMP/source-product"
          if ($LASTEXITCODE) { throw 'Source product assembly failed' }
          $env:EDUWORK_TEST_RUNTIME = "$env:RUNNER_TEMP/native-runtime"
          $env:EDUWORK_TEST_PRODUCT = "$env:RUNNER_TEMP/source-product"
          $env:EDUWORK_TEST_SOURCE = "$env:RUNNER_TEMP/source-stage"
          $env:EDUWORK_TEST_DEPENDENCIES = "$env:RUNNER_TEMP/source-deps"
          $env:EDUWORK_TEST_HOST = "$env:RUNNER_TEMP/native-host"
          node --test core/scripts/test/distribution-config-patches.test.mjs
          if ($LASTEXITCODE) { throw 'Assembled edition configuration checks failed' }
          node core/scripts/probe-017-source-product.mjs --product "$env:RUNNER_TEMP/source-product" --host "$env:RUNNER_TEMP/native-host" --output "$env:RUNNER_TEMP/assembled-evidence"
          if ($LASTEXITCODE) { throw 'Assembled product qualification failed' }
          node core/scripts/probe-017-literature.mjs --product "$env:RUNNER_TEMP/source-product" --output "$env:RUNNER_TEMP/literature-evidence"
          if ($LASTEXITCODE) { throw 'Maintained literature integration failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-host-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/native-host-evidence/report.json
            ${{ runner.temp }}/native-host/receipt.json
            ${{ runner.temp }}/settings-evidence/report.json
            ${{ runner.temp }}/client-build.json
            ${{ runner.temp }}/assembled-evidence/report.json
            ${{ runner.temp }}/deliverables-evidence/report.json
            ${{ runner.temp }}/literature-evidence/report.json
            ${{ runner.temp }}/native-shell/source-receipt.json
            ${{ runner.temp }}/native-desktop-evidence/report.json
            ${{ runner.temp }}/native-desktop-evidence/electron.log
          if-no-files-found: ignore
