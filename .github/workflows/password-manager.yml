name: Check optional browser password manager
on:
  pull_request:
    paths:
      - 'packages/dsh-password-manager/**'
      - 'dsh-electron/**'
      - 'dsh-plugins/client-ui-branding/**'
      - '.github/workflows/password-manager.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --prefix packages/dsh-password-manager --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix packages/dsh-password-manager
      - run: npm ci --prefix dsh-electron/vendor/orca --ignore-scripts --no-audit --no-fund
      - run: npm exec -- vitest run
        working-directory: dsh-electron/vendor/orca
      - run: node --test dsh-electron/tests/builtin-password-agent.test.mjs dsh-electron/tests/native-vault.test.mjs dsh-plugins/client-ui-branding/test/settings-search.test.mjs
