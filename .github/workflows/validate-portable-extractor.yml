name: Verify portable extractor
on:
  pull_request:
    paths:
      - 'dsh-desktop/internal/portable/**'
      - 'dsh-desktop/internal/installguard/**'
      - 'dsh-desktop/internal/electronaccess/**'
      - 'dsh-desktop/internal/winacl/**'
      - 'dsh-desktop/internal/workspaceaccess/**'
      - 'dsh-desktop/internal/updater/**'
      - 'dsh-desktop/internal/updatecontrol/**'
      - 'dsh-desktop/cmd/eduwork-updater/**'
      - 'dsh-desktop/cmd/eduwork-extract/**'
      - 'scripts/portable-extractor.mjs'
      - 'scripts/lib/windows-pe.mjs'
      - 'scripts/pe-resources/**'
      - 'scripts/ci-eduwork-windows-release.mjs'
      - 'scripts/publish-windows-release.mjs'
      - 'scripts/github-update-manifest.mjs'
      - 'scripts/windows-update-delta.mjs'
      - 'scripts/test/windows-update-delta.test.mjs'
      - 'tests/eduwork-windows-release.test.mjs'
      - 'tests/github-update-package.test.mjs'
      - 'scripts/portable-extractor.manifest'
      - '.github/workflows/validate-portable-extractor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-extractor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Check long paths, corruption, cancellation and existing data
        working-directory: dsh-desktop
        shell: bash
        run: |
          go test -v ./internal/installguard ./internal/portable ./internal/electronaccess ./internal/workspaceaccess ./internal/winacl ./internal/updater ./internal/updatecontrol ./cmd/eduwork-updater ./cmd/eduwork-extract
          go vet ./internal/installguard ./internal/portable ./internal/electronaccess ./internal/workspaceaccess ./internal/winacl ./internal/updater ./cmd/eduwork-extract
          go build -trimpath -o "$RUNNER_TEMP/eduwork-extract.exe" ./cmd/eduwork-extract
      - name: Build both branded packages and verify release publication inputs
        shell: bash
        run: |
          node --test tests/github-update-package.test.mjs tests/eduwork-windows-release.test.mjs scripts/test/windows-update-delta.test.mjs
