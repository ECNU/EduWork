name: Check npm packages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.changed.outputs.groups }}
      checks: ${{ steps.changed.outputs.checks }}
      packages: ${{ steps.changed.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node --test tests/package-maintenance.test.mjs tests/ci-changes.test.mjs
      - run: node scripts/check-source-docs.mjs
      - id: changed
        run: node scripts/ci-changes.mjs
  check:
    needs: select
    if: needs.select.outputs.groups != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: ${{ matrix.package == 'dsh-calendar' && 'dsh-plugins/calendar/package-lock.json' || matrix.package == 'dsh-calendar-subscriptions' && 'dsh-plugins/calendar-subscriptions/package-lock.json' || format('packages/{0}/package-lock.json', matrix.package) }}
      - uses: actions/setup-python@v5
        if: matrix.package == 'dsh-knowledge-studio'
        id: python
        with:
          python-version: '3.12'
      - if: matrix.package == 'dsh-knowledge-studio'
        run: python -m pip install -r packages/dsh-knowledge-studio/packages/artifact-services/python/requirements.txt
      - run: node scripts/packages/manage.mjs install ${{ matrix.package }}
      - name: Install locked DSH Runtime for native plugin checks
        if: matrix.package == 'dsh-side-chat' || matrix.package == 'dsh-decision' || matrix.package == 'dsh-auto-approval' || contains(matrix.package, 'calendar')
        working-directory: third_party/dsh/candidate-v0.2.2-rc.3/npm-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/packages/manage.mjs check ${{ matrix.package }}
        env:
          DSH_OFFICE_PYTHON: ${{ steps.python.outputs.python-path }}
          PYTHONUTF8: '1'
          EDUWORK_TEST_RUNTIME: ${{ contains(matrix.package, 'calendar') && format('{0}/third_party/dsh/candidate-v0.2.2-rc.3/npm-runtime', github.workspace) || '' }}
          EDUWORK_SIDE_CHAT_RUNTIME: ${{ matrix.package == 'dsh-side-chat' && format('{0}/third_party/dsh/candidate-v0.2.2-rc.3/npm-runtime', github.workspace) || '' }}
          EDUWORK_DECISION_RUNTIME: ${{ matrix.package == 'dsh-decision' && format('{0}/third_party/dsh/candidate-v0.2.2-rc.3/npm-runtime', github.workspace) || '' }}
          EDUWORK_AUTO_APPROVAL_RUNTIME: ${{ matrix.package == 'dsh-auto-approval' && format('{0}/third_party/dsh/candidate-v0.2.2-rc.3/npm-runtime', github.workspace) || '' }}
      # Packed on Linux, as for publication; the Windows run only checks.
      - if: runner.os == 'Linux'
        run: node scripts/packages/manage.mjs pack ${{ matrix.package }}
      - if: runner.os == 'Linux' && matrix.package == 'dsh-knowledge-studio'
        run: node scripts/packages/manage.mjs pack dsh-artifact-services
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: npm-check-${{ matrix.package }}
          path: dist/npm-packages/
          retention-days: 7
          if-no-files-found: error
  result:
    name: npm package result
    if: always()
    needs: [select, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/ci-result.mjs
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
          REQUIRED: ${{ needs.select.outputs.packages }}
          RESULTS: ${{ format('["{0}"]', needs.check.result) }}
