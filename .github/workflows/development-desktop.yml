name: Build desktop apps
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional development Product SemVer; defaults to the source version and run number'
        required: false
        type: string
      platform:
        description: 'Platforms to validate; main pushes always build all three targets'
        required: true
        default: both
        type: choice
        options: [both, windows, macos, macos-arm64, macos-x64]
      data_layout:
        description: 'Windows experimental data layout; ignored for macOS'
        required: false
        default: portable
        type: choice
        options: [portable, installed]
permissions:
  contents: read
concurrency:
  group: desktop-apps-${{ github.sha }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: false
jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      development_version: ${{ steps.resolve.outputs.development_version }}
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Resolve development version
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          SELECTED_PLATFORMS: ${{ inputs.platform || 'both' }}
        run: |
          REQUESTED_VERSION="${REQUESTED_VERSION#"${REQUESTED_VERSION%%[![:space:]]*}"}"
          REQUESTED_VERSION="${REQUESTED_VERSION%"${REQUESTED_VERSION##*[![:space:]]}"}"
          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="$REQUESTED_VERSION"
          else
            base=$(node -p "require('./source-receipt.json').version.split('-')[0]")
            if [[ -z "$base" ]]; then exit 1; fi
            version="$base-dev.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]{8}\.[1-9][0-9]*$ ]]; then echo '::error::Development version must use X.Y.Z-dev.YYYYMMDD.N'; exit 1; fi
          echo "targets=$(node scripts/desktop-build-targets.mjs "$SELECTED_PLATFORMS")" >> "$GITHUB_OUTPUT"
          echo "development_version=$version" >> "$GITHUB_OUTPUT"
  build:
    name: Build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Select the shared macOS toolchain
        if: matrix.script == 'macos'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-python@v5
        if: matrix.script == 'macos'
        with:
          python-version: '3.11'
      - name: Build and accept desktop app
        shell: bash
        env:
          DEVELOPMENT_VERSION: ${{ needs.version.outputs.development_version }}
          DATA_LAYOUT: ${{ inputs.data_layout || 'portable' }}
        run: |
          EXTRA_ARGS=()
          if [ "${{ matrix.script }}" = "windows" ]; then
            EXTRA_ARGS+=("--data-layout" "$DATA_LAYOUT")
            if [ "$DATA_LAYOUT" = "installed" ]; then EXTRA_ARGS+=("--no-verify-snapshot"); fi
          fi
          node core/scripts/ci-eduwork-${{ matrix.script }}-release.mjs \
            --core-root ./core --edition-root ./core \
            --distribution-config config/distributions/generic.json \
            --version "$DEVELOPMENT_VERSION" --development --recipe pinned-source \
            --output "$RUNNER_TEMP/ew-development" "${EXTRA_ARGS[@]}"
      - name: Retain redacted validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-development-validation
          path: ${{ runner.temp }}/ew-development/evidence-public
          retention-days: 7
          if-no-files-found: warn
      - name: Retain the verified desktop app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-development
          path: ${{ runner.temp }}/ew-development/publish
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
