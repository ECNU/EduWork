name: Build desktop apps
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional development Product SemVer; defaults to the source version and run number'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-apps-${{ github.sha }}
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      development_version: ${{ steps.resolve.outputs.development_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Resolve development version
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="$REQUESTED_VERSION"
          else
            base=$(node -p "require('./source-receipt.json').version.split('-')[0]")
            if [[ -z "$base" ]]; then exit 1; fi
            version="$base-dev.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]{8}\.[1-9][0-9]*$ ]]; then exit 1; fi
          echo "development_version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-python@v5
        if: matrix.platform == 'macos'
        with:
          python-version: '3.11'
      - name: Build and accept desktop app
        shell: bash
        env:
          DEVELOPMENT_VERSION: ${{ needs.version.outputs.development_version }}
        run: |
          node core/scripts/ci-eduwork-${{ matrix.platform }}-release.mjs \
            --core-root ./core --edition-root ./core \
            --distribution-config config/distributions/generic.json \
            --version "$DEVELOPMENT_VERSION" --development --recipe pinned-source \
            --output "$RUNNER_TEMP/ew-development"
      - name: Retain redacted validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-development-validation
          path: ${{ runner.temp }}/ew-development/evidence-public
          retention-days: 7
          if-no-files-found: warn
      - name: Retain the verified desktop app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-development
          path: ${{ runner.temp }}/ew-development/publish
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
