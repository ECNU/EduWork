name: Verify desktop publication
on:
  pull_request:
    paths:
      - '.github/workflows/*desktop*.yml'
      - 'scripts/publish-desktop-candidate.mjs'
      - 'config/desktop-build.json'
      - 'scripts/desktop-build-plan.mjs'
      - 'scripts/lib/pinned-source-stages.mjs'
      - 'scripts/lib/windows-stages.mjs'
      - 'scripts/lib/macos-stages.mjs'
      - 'scripts/ci-eduwork-windows-release.mjs'
      - 'scripts/ci-eduwork-macos-release.mjs'
      - 'scripts/publish-windows-release.mjs'
      - 'scripts/prepare-pinned-dsh-product.mjs'
      - 'scripts/macos-update-feed.mjs'
      - 'tests/windows-package-preflight.test.mjs'
      - 'tests/desktop-build-plan.test.mjs'
      - 'scripts/test/macos-update-feed.test.mjs'
      - 'tests/desktop-candidate-publication.test.mjs'
      - 'scripts/verify-generic-first-launch.mjs'
      - 'tests/generic-first-launch.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: node --test tests/windows-package-preflight.test.mjs tests/desktop-build-plan.test.mjs tests/desktop-candidate-publication.test.mjs tests/eduwork-windows-release.test.mjs tests/generic-first-launch.test.mjs scripts/test/macos-update-feed.test.mjs
