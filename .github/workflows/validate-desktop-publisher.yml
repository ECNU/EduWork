name: Verify desktop publication
on:
  pull_request:
    paths:
      - '.github/workflows/*desktop*.yml'
      - 'scripts/publish-desktop-candidate.mjs'
      - 'scripts/publish-windows-release.mjs'
      - 'tests/desktop-candidate-publication.test.mjs'
      - 'scripts/verify-generic-first-launch.mjs'
      - 'scripts/test-017-alpha-desktop.ps1'
      - 'tests/generic-first-launch.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: node --test tests/desktop-candidate-publication.test.mjs tests/eduwork-windows-release.test.mjs tests/generic-first-launch.test.mjs
