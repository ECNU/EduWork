name: Build desktop release candidates
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Product SemVer, for example 0.4.0-alpha.1 or 0.4.0'
        required: true
        type: string
      build_mode:
        description: 'Build with Node.js or PowerShell'
        required: true
        default: node
        type: choice
        options: [node, ps1]
      development:
        description: 'Build a development artifact without release notes or publication (Node only)'
        type: boolean
        default: false
      release_notes:
        description: 'Approved docs/releases/<version>.md file (release candidate only)'
        required: false
        type: string
      notes_approved:
        description: 'The project owner approved this version and release text'
        required: true
        default: false
        type: boolean
      publish:
        description: 'Publish directly from CI after all selected targets pass'
        required: true
        default: false
        type: boolean
      platform:
        description: 'Build all selected targets, or diagnose one native platform'
        required: true
        default: both
        type: choice
        options: [both, windows, macos, macos-arm64, macos-x64]
permissions:
  contents: read
concurrency:
  group: desktop-candidate-${{ github.sha }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      targets: ${{ steps.validate.outputs.targets }}
      mac_targets: ${{ steps.validate.outputs.mac_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          persist-credentials: false
      - name: Validate requested build and publication
        id: validate
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          DEVELOPMENT_BUILD: ${{ inputs.development }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_NOTES_APPROVED: ${{ inputs.notes_approved }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          SELECTED_PLATFORMS: ${{ inputs.platform }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#"${RELEASE_VERSION%%[![:space:]]*}"}"
          RELEASE_VERSION="${RELEASE_VERSION%"${RELEASE_VERSION##*[![:space:]]}"}"
          if [[ "$DEVELOPMENT_BUILD" == true ]]; then
            [[ "$BUILD_MODE" == node ]]
            [[ "$PUBLISH_RELEASE" != true ]]
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]{8}\.[1-9][0-9]*$ ]] || { echo '::error::Development version must use X.Y.Z-dev.YYYYMMDD.N'; exit 1; }
            [[ -z "$RELEASE_NOTES" ]]
            [[ "$RELEASE_NOTES_APPROVED" != true ]]
          elif [[ "$BUILD_MODE" == node ]]; then
            node core/scripts/desktop-build-plan.mjs --core ./core --edition ./core --version "$RELEASE_VERSION" >/dev/null
            [[ "$RELEASE_NOTES_APPROVED" == true ]]
            [[ "$RELEASE_NOTES" == "docs/releases/$RELEASE_VERSION.md" ]]
            [[ -s "core/$RELEASE_NOTES" ]]
          fi
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]]
            [[ "$SELECTED_PLATFORMS" == both ]]
            [[ "$RELEASE_NOTES_APPROVED" == true ]]
            [[ "$RELEASE_NOTES" == "docs/releases/$RELEASE_VERSION.md" ]]
            [[ -s "core/$RELEASE_NOTES" ]]
          fi
          targets=$(node core/scripts/desktop-build-targets.mjs "$SELECTED_PLATFORMS" "$BUILD_MODE")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "mac_targets=$(node -e 'console.log(JSON.stringify(JSON.parse(process.argv[1]).filter(t => t.script === "macos")))' "$targets")" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
  build:
    name: Build (${{ matrix.platform }})
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.policy.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Select the shared macOS toolchain
        if: matrix.script == 'macos'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-python@v5
        if: matrix.script == 'macos'
        with:
          python-version: '3.11'
      - name: Build and validate the exact desktop archive
        if: inputs.build_mode == 'ps1'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.policy.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_NOTES_APPROVED: ${{ inputs.notes_approved }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          SELECTED_PLATFORMS: ${{ inputs.platform }}
        run: ./core/scripts/build-desktop-candidate.ps1 -CoreRoot ./core -EditionRoot ./core -Version $env:RELEASE_VERSION -Output "$env:RUNNER_TEMP/ew-candidate"
      - name: Download earlier stable releases for delta updates
        if: inputs.build_mode == 'node' && !inputs.development
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.policy.outputs.version }}
        run: node core/scripts/update-delta-bases.mjs "$GITHUB_REPOSITORY" EduWork "$RELEASE_VERSION" ${{ matrix.platform }} "$RUNNER_TEMP/delta-bases"
      - name: Build and validate the Node stage desktop archive
        if: inputs.build_mode == 'node'
        shell: bash
        env:
          DEVELOPMENT_BUILD: ${{ inputs.development }}
          RELEASE_VERSION: ${{ needs.policy.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_NOTES_APPROVED: ${{ inputs.notes_approved }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          SELECTED_PLATFORMS: ${{ inputs.platform }}
        run: |
          args=(--core-root ./core --edition-root ./core
            --distribution-config config/distributions/generic.json
            --recipe pinned-source
            --version "$RELEASE_VERSION"
            --output "$RUNNER_TEMP/ew-candidate")
          if [[ "$DEVELOPMENT_BUILD" == true ]]; then
            args+=(--development)
          else
            args+=(--release-notes-file "$RELEASE_NOTES")
            if [[ "$RELEASE_NOTES_APPROVED" == true ]]; then args+=(--release-notes-approved); fi
            args+=(--delta-bases "$RUNNER_TEMP/delta-bases")
          fi
          node core/scripts/ci-eduwork-${{ matrix.script }}-release.mjs "${args[@]}"
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-validation
          path: ${{ runner.temp }}/ew-candidate/evidence-public
          retention-days: 7
          if-no-files-found: warn
      - name: Retain candidate files for acceptance before publication
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          path: ${{ runner.temp }}/ew-candidate/publish
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  compatibility:
    name: macOS 15 (${{ matrix.platform }})
    needs: [policy, build]
    if: inputs.build_mode == 'node' && inputs.platform != 'windows'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.policy.outputs.mac_targets) }}
    runs-on: ${{ matrix.compatibilityRunner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          path: ${{ runner.temp }}/candidate
      - name: Verify the macOS 26-built archive on macOS 15
        run: node scripts/accept-macos-candidate.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/macos-15-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-macos15-validation
          path: ${{ runner.temp }}/macos-15-acceptance/evidence-public
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: [policy, build, compatibility]
    if: always() && inputs.publish && needs.build.result == 'success' && (inputs.build_mode == 'ps1' || needs.compatibility.result == 'success')
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-desktop-candidate.yml
    with:
      source_run_id: '${{ github.run_id }}'
      version: ${{ needs.policy.outputs.version }}
      build_mode: ${{ inputs.build_mode }}
      release_notes: ${{ inputs.release_notes }}
      notes_approved: ${{ inputs.notes_approved }}
      publish: true
