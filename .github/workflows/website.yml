name: Project website
on:
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  # Releases published with GITHUB_TOKEN do not start a release event workflow.
  workflow_run:
    workflows: ['Publish desktop candidate']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always publish the reviewed site on main; PRs only build their merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Check site code and stable download selection
        run: |
          node --check website/project.js
          node --check website/language.js
          node --check website/theme-init.js
          node --test website/community-data.test.mjs
      - name: Build pull request preview from public snapshot
        if: github.event_name == 'pull_request'
        run: node website/build.mjs --offline
      - name: Refresh public metadata and stable downloads
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node website/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/website
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
